<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cas van der Hoven</title>
<meta name="description" content="Cas van der Hoven. LinkedIn and personal projects.">
<link rel="canonical" href="https://casvanderhoven.com/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --paper: #f1ede2;
    --ink: #141414;
    --red: #d62a1e;
    --blue: #1d4f9c;
    --yellow: #f2b90f;
    --rule: 4px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #141414; --ink: #f1ede2; --blue: #3b76d1; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    background: var(--paper);
    color: var(--ink);
    font-family: Futura, "Futura PT", "Century Gothic", "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }

  /* Left: name and links */
  .text {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 3rem;
    padding: clamp(1.5rem, 5vw, 4rem);
    border-right: var(--rule) solid var(--ink);
  }
  h1 {
    font-size: clamp(2.75rem, 7.5vw, 7rem);
    font-weight: 700;
    line-height: 0.92;
    letter-spacing: -0.03em;
    text-transform: lowercase;
  }
  h1 span { display: block; }

  ul { list-style: none; border-top: var(--rule) solid var(--ink); }
  li { border-bottom: var(--rule) solid var(--ink); }
  a, .row {
    display: grid;
    grid-template-columns: 1.25rem 1fr auto;
    align-items: center;
    gap: 1rem;
    padding: 1.1rem 0.5rem;
    color: inherit;
    text-decoration: none;
    font-size: clamp(1.15rem, 2vw, 1.6rem);
    font-weight: 500;
    letter-spacing: 0.02em;
    text-transform: lowercase;
    transition: background-color 0.15s, color 0.15s;
  }
  a:hover, a:focus-visible {
    background: var(--ink);
    color: var(--paper);
    outline: none;
  }
  small { font-size: 0.6em; letter-spacing: 0.12em; text-transform: uppercase; }
  .arrow { font-size: 1.1em; transition: transform 0.15s; }
  a:hover .arrow, a:focus-visible .arrow { transform: translateX(0.3rem); }

  .mark { width: 1.25rem; height: 1.25rem; display: block; }
  .square { background: var(--red); }
  .circle { background: var(--blue); border-radius: 50%; }
  .triangle { background: var(--yellow); clip-path: polygon(50% 0, 100% 100%, 0 100%); }

  /* Right: composition */
  .art { display: grid; grid-template-rows: minmax(0, 3fr) minmax(0, 2fr); min-height: 0; overflow: hidden; }
  .art div { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .art .top { border-bottom: var(--rule) solid var(--ink); background: var(--yellow); }
  .art .bottom { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
  .art .bottom > :first-child { background: var(--red); border-right: var(--rule) solid var(--ink); }
  .art .bottom > :last-child { background: var(--paper); }

  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: 38svh 1fr; }
    .text { border-right: 0; order: 2; gap: 2.5rem; }
    .art { order: 1; border-bottom: var(--rule) solid var(--ink); }
  }
  @media (prefers-reduced-motion: reduce) {
    a, .arrow { transition: none; }
  }
</style>
</head>
<body>
  <main class="text">
    <h1><span>Cas</span><span>van der</span><span>Hoven</span></h1>
    <nav aria-label="Links">
      <ul>
        <li><a href="https://www.linkedin.com/in/casimirvanderhoven/" rel="me noopener"><i class="mark square" aria-hidden="true"></i>LinkedIn<span class="arrow" aria-hidden="true">&rarr;</span></a></li>
        <li><a href="https://aski.fit/" rel="noopener"><i class="mark circle" aria-hidden="true"></i>Aski<span class="arrow" aria-hidden="true">&rarr;</span></a></li>
        <li><a href="https://haftalik.casvanderhoven.com/" rel="noopener"><i class="mark triangle" aria-hidden="true"></i>Haftalik<span class="arrow" aria-hidden="true">&rarr;</span></a></li>
      </ul>
    </nav>
  </main>

  <div class="art" aria-hidden="true">
    <div class="top">
      <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
        <circle cx="50" cy="50" r="34" fill="var(--blue)"/>
        <rect x="0" y="48" width="100" height="4" fill="var(--ink)"/>
      </svg>
    </div>
    <div class="bottom">
      <div>
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <polygon points="0,100 100,100 0,0" fill="var(--ink)"/>
        </svg>
      </div>
      <div>
        <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
          <path d="M20 80 A60 60 0 0 1 80 20 L80 80 Z" fill="var(--ink)"/>
          <circle cx="62" cy="62" r="9" fill="var(--yellow)"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
